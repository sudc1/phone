<style>
:root{
  --blue:#0f4c81; --blue-d:#0a3a63; --bg:#f2f4f7; --card:#ffffff;
  --txt:#1c2733; --sub:#5d6977; --line:#dde3e9; --accent:#e8f1f9;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:1.05rem;font-weight:700;letter-spacing:-.02em}
header .sub{font-size:.74rem;opacity:.88;margin-top:3px}
.searchwrap{position:relative;margin-top:10px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#8aa7c2;pointer-events:none}
#q{width:100%;padding:12px 40px 12px 40px;border:none;border-radius:12px;font-size:1rem;background:#fff;color:var(--txt);outline:none}
#q::placeholder{color:#9aa8b5}
#q::-webkit-search-cancel-button{display:none}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:#dde5ec;color:#5a6a79;width:26px;height:26px;border-radius:50%;font-size:.9rem;display:none;cursor:pointer}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
#count{font-size:.78rem;color:var(--sub);padding:2px 6px 10px}
/* 부서 아코디언 */
.dept{background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(16,36,60,.07);overflow:hidden}
.dept-btn{width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;border:none;background:none;font:inherit;color:var(--txt);cursor:pointer;text-align:left}
.dept-btn .dn{font-size:.98rem;font-weight:700;flex:1;letter-spacing:-.01em}
.dept-btn .cnt{font-size:.78rem;color:var(--sub);background:var(--bg);padding:3px 9px;border-radius:999px}
.dept-btn .arrow{width:18px;height:18px;stroke:var(--sub);transition:transform .2s;flex:0 0 auto}
.dept.open .dept-btn .arrow{transform:rotate(180deg)}
.dept.open .dept-btn{border-bottom:1px solid var(--line)}
.dept-body{display:none;padding:8px 10px 10px;background:#fafbfc}
.dept.open .dept-body{display:block}
.team-head{font-size:.78rem;font-weight:700;color:var(--blue);padding:10px 6px 4px}
/* 인물 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:7px;display:flex;flex-direction:column;gap:8px}
.row1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.title{font-size:.78rem;color:var(--blue);background:var(--accent);padding:2px 8px;border-radius:6px;font-weight:600}
.meta{font-size:.78rem;color:var(--sub)}
.note{font-size:.73rem;color:#a06a00;background:#fdf3dd;padding:2px 8px;border-radius:6px}
.phones{display:flex;gap:8px;flex-wrap:wrap}
.phones a{display:flex;align-items:center;gap:7px;text-decoration:none;padding:10px 13px;border-radius:10px;font-size:.92rem;font-weight:600;flex:1 1 45%;min-width:150px;justify-content:center}
a.mob{background:var(--blue);color:#fff}
a.tel{background:#eef2f6;color:var(--txt);border:1px solid var(--line)}
.phones a svg{width:15px;height:15px;flex:0 0 auto}
.lbl{display:block;font-size:.68rem;font-weight:500;opacity:.8;margin-top:2px;white-space:nowrap}
mark{background:#ffe28a;border-radius:2px;padding:0 1px}
#empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:.9rem;display:none}
#empty b{display:block;font-size:2rem;margin-bottom:10px}
#hint{text-align:center;color:var(--sub);font-size:.82rem;padding:6px 10px 14px;line-height:1.6}
.foot{text-align:center;font-size:.7rem;color:#9aa8b5;padding:20px 0 30px;line-height:1.6}
.dept-head{font-size:.85rem;font-weight:700;color:var(--blue);padding:12px 6px 6px}
.dept-head .n{font-weight:500;color:var(--sub);font-size:.75rem}
@media(min-width:600px){ .phones a{flex:0 1 auto} }
</style>
</head>

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const cho = s => [...s].map(ch => {
  const c = ch.charCodeAt(0);
  return (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : ch;
}).join("");
DATA.forEach(c => {
  c._cho = cho(c.name);
  c._hay = (c.name + " " + c.dept + " " + c.team + " " + c.title + " " + c.note + " " +
            c.mobile + " " + c.tel + " " + c.mobile.replace(/-/g,"") + " " + c.tel.replace(/-/g,"")).toLowerCase();
});
const DEPT_ORDER = [];
DATA.forEach(c => { if (!DEPT_ORDER.includes(c.dept)) DEPT_ORDER.push(c.dept); });
DEPT_ORDER.sort((a,b) => a === "경영진" ? -1 : b === "경영진" ? 1 : a.localeCompare(b, "ko"));

  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i >= 0) return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
  const ci = cho(text).indexOf(q);
  if(ci >= 0 && /^[ㄱ-ㅎ]+$/.test(q)) return esc(text.slice(0,ci)) + "<mark>" + esc(text.slice(ci,ci+q.length)) + "</mark>" + esc(text.slice(ci+q.length));
  return esc(text);
}

    <div class="phones">
      ${c.mobile ? `<a class="mob" href="${telHref(c.mobile)}">${PH}<span>${c.mobile}<span class="lbl"> 휴대폰</span></span></a>` : ""}
      ${c.tel ? `<a class="tel" href="${telHref(c.tel)}">${PH}<span>${telDisp(c.tel)}<span class="lbl"> 부서전화</span></span></a>` : ""}
      ${!c.mobile && !c.tel ? `<span class="meta">등록된 번호 없음</span>` : ""}
    </div>
  </div>`;
}

/* 부서 내부: 팀별 소제목으로 묶어 표시 */
function deptBody(dept){
  const rows = DATA.filter(c => c.dept === dept);
  const teams = [];
  rows.forEach(c => { const t = c.team || ""; if(!teams.includes(t)) teams.push(t); });
  let html = "";
  for(const t of teams){
    const arr = rows.filter(c => (c.team || "") === t);
    if(t && teams.length > 1) html += `<div class="team-head">${esc(t)} (${arr.length}명)</div>`;
    html += arr.map(c => personCard(c, "", false)).join("");
  }
  return html;
}

function renderDepts(){
  $count.textContent = "";
  $empty.style.display = "none";
  $hint.textContent = "부서를 누르면 전체 명단이 열립니다.";
  let html = "";
  for(const d of DEPT_ORDER){
    const n = DATA.filter(c => c.dept === d).length;
    const open = openDepts.has(d);
    html += `<div class="dept${open ? " open" : ""}" data-dept="${esc(d)}">
      <button class="dept-btn" type="button">
        <span class="dn">${esc(d)}</span><span class="cnt">${n}명</span>${ARROW}
      </button>
      <div class="dept-body">${open ? deptBody(d) : ""}</div>
    </div>`;
  }
  $list.innerHTML = html;
  document.querySelectorAll(".dept-btn").forEach(btn => {
    btn.onclick = () => {
      const box = btn.parentElement, d = box.dataset.dept;
      if(openDepts.has(d)){ openDepts.delete(d); box.classList.remove("open"); }
      else {
        openDepts.add(d); box.classList.add("open");
        const body = box.querySelector(".dept-body");
        if(!body.innerHTML) body.innerHTML = deptBody(d);
      }
    };
  });
}

function renderSearch(raw){
  $hint.textContent = "";
  const qc = raw.replace(/\s+/g,"");
  const rows = DATA.filter(c =>
    c._hay.includes(raw) || c._hay.replace(/\s+/g,"").includes(qc) ||
    (/^[\u3131-\u314E]+$/.test(qc) && c._cho.includes(qc))
  );
  $count.textContent = `검색 결과 ${rows.length}명`;
  $empty.style.display = rows.length ? "none" : "block";
  const byDept = new Map();
  rows.forEach(c => { if(!byDept.has(c.dept)) byDept.set(c.dept, []); byDept.get(c.dept).push(c); });
  let html = "";
  for(const d of DEPT_ORDER){
    if(!byDept.has(d)) continue;
    const arr = byDept.get(d);
    html += `<div class="dept-head">${esc(d)} <span class="n">${arr.length}명</span></div>`;
    html += arr.map(c => personCard(c, raw, true)).join("");
  }
  $list.innerHTML = html;
}

function render(){
  const raw = $q.value.trim().toLowerCase();
  $clear.style.display = raw ? "block" : "none";
  if(raw) renderSearch(raw); else renderDepts();
}
$q.addEventListener("input", render);
$clear.onclick = () => { $q.value = ""; render(); $q.focus(); };
render();
</script>
</body>
</html>
